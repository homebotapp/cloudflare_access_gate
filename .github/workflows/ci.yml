name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: rspec (ruby ${{ matrix.ruby }}, rack ${{ matrix.rack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches required_ruby_version in the gemspec.
        ruby: ['3.1', '3.2', '3.3', '3.4']
        # Rack 2 and Rack 3 differ on response-header rules, so both are
        # exercised — spec/rack_compliance_spec.rb runs Rack::Lint on each.
        rack: ['2.2', '3']
    env:
      RACK_VERSION: ${{ matrix.rack }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel
